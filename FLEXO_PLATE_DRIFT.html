<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLEXO Plate travel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* the app's ThemeContext palette and the Plate Rolls hairlines */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --bg2: #1a1a1a; --hair: #333; --hair2: #555;
    --tx: #ffffff; --tx2: #e5e5e5; --mu: #a3a3a3; --pri: #3b82f6; --on: rgba(59,130,246,.16);
    --warn: #fbbf24; --grid: rgba(255,255,255,.10); --zero: #d4d4d4;
    --steel: #6d7076; --tape: #b5814d; --backing: #b8ae6a; --polymer: #4f8e79; --pitch: #f87171;
    --f-bcd: #38bdf8; --f-temp: #f472b6; --f-plate: #4ade80; --f-tape: #fb923c; --f-all: #e2e0da;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --bg2: #f5f5f5; --hair: #d4d4d4; --hair2: #a3a3a3;
    --tx: #1a1a1a; --tx2: #333333; --mu: #666666; --on: rgba(59,130,246,.14);
    --warn: #b45309; --grid: rgba(0,0,0,.10); --zero: #404040;
    --steel: #9a9ca1; --tape: #e8b27a; --backing: #f2e9a8; --polymer: #7fb7a4; --pitch: #c02626;
    --f-bcd: #00a3e0; --f-temp: #e4007c; --f-plate: #2e9e4f; --f-tape: #f07d1a; --f-all: #2b2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
  .muted { color: var(--mu); font-size: 12px; }
  .sp { flex: 1; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }

  .page { padding: 14px 18px 28px; max-width: 1500px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .head h1 span { margin-left: 8px; font-weight: 400; letter-spacing: 0; color: var(--mu); }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--hair); background: transparent; color: var(--tx2); white-space: nowrap; }
  .pill.on { border-color: var(--pri); background: var(--on); color: var(--tx); }
  .pill.sm { height: 24px; padding: 0 8px; font-size: 12px; }
  .pill.icon { padding: 0 6px; min-width: 32px; gap: 6px; }
  .pill.icon small { font-size: 11px; font-weight: 800; font-family: Consolas, monospace; }
  .pill svg { display: block; flex: none; }
  .ink { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--tx2); }
  .ink input { width: 110px; margin: 0; accent-color: var(--pri); }
  .cap { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--mu); }

  /* the top row: the tooth count in its own box, then the repeat, the standard BCD,
     the distortion both ways, and the four factors together in one box */
  .facts { display: grid; grid-template-columns: 150px minmax(140px, 1fr) minmax(140px, 1fr) minmax(200px, 1.25fr) minmax(620px, 4fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  #facts-rest { display: contents; }
  .fact { padding: 9px 12px; min-width: 0; background: var(--bg); }
  .fact.key { background: var(--bg2); }
  .fact .k { display: block; font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact .v { font-size: 20px; font-weight: 800; font-family: Consolas, monospace; white-space: nowrap; }
  .fact .v .hi { margin-left: 12px; color: var(--mu); }
  .fact .s { font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact.teeth input { display: block; width: 92px; height: 28px; padding: 0 6px; border: 1px solid var(--hair2); border-radius: 6px; background: var(--bg2); color: var(--tx); font-family: Consolas, monospace; font-size: 20px; font-weight: 800; }
  .fact.four .each { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 12px; }
  .fact.four .k i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  @media (max-width: 1320px) { .facts { grid-template-columns: repeat(4, minmax(0,1fr)); } .fact.four { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .facts { grid-template-columns: repeat(2, minmax(0,1fr)); } .fact.four .each { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; } }

  .panel { border: 1px solid var(--hair); border-radius: 8px; min-width: 0; margin-bottom: 12px; }
  .phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--hair); }
  .phead h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--mu); }

  /* the factor rows */
  .scroll { overflow-x: auto; }
  .rows { min-width: 1120px; }
  .frow { display: grid; grid-template-columns: 196px minmax(300px, 1fr) 176px minmax(260px, 1.15fr) 176px; align-items: center; border-bottom: 1px solid var(--hair); }
  .frow:last-child { border-bottom: 0; }
  .frow > div { padding: 8px 10px; min-width: 0; }
  .frow.hd > div { padding: 5px 10px; font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--mu); white-space: nowrap; }
  .fname { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .fname i { flex: none; width: 12px; height: 12px; border-radius: 3px; }
  .fstd { font-size: 12px; color: var(--mu); margin-left: 20px; white-space: nowrap; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl input[type=range] { flex: 1; min-width: 90px; margin: 0; accent-color: var(--pri); }
  .ctl output { width: 9ch; text-align: right; font-family: Consolas, monospace; font-weight: 800; font-size: 15px; white-space: nowrap; }
  .nudge { width: 26px; height: 26px; padding: 0; border: 1px solid var(--hair); border-radius: 6px; background: transparent; cursor: pointer; font-size: 16px; font-weight: 700; line-height: 1; }
  .nudge { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .nudge:disabled { opacity: .3; cursor: default; }
  /* a reset is amber while its slider is off the standard, and plain grey when there is nothing to reset */
  .nudge[data-reset] { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .nudge[data-reset]:disabled { color: var(--mu); border-color: var(--hair); background: transparent; }
  .sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ln { display: flex; align-items: center; gap: 6px; height: 22px; white-space: nowrap; font-size: 13px; }
  .ln .who { width: 72px; font-size: 12px; color: var(--mu); }
  .ln.pick .who { color: var(--tx); font-weight: 800; }
  .ln .fig { font-family: Consolas, monospace; font-variant-numeric: tabular-nums; }
  .ln small { font-size: 12px; color: var(--mu); }
  .right { justify-content: flex-end; }
  .axis { position: relative; height: 26px; }
  .axis > span { position: absolute; top: 12px; transform: translateX(-50%); font-family: Consolas, monospace; font-size: 11px; font-weight: 400; letter-spacing: 0; }
  .axis .t { top: 0; left: 50%; font-family: inherit; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
  .axis .l { top: 0; left: 0; transform: none; font-family: inherit; font-weight: 800; }
  .axis .r { top: 0; left: auto; right: 0; transform: none; font-family: inherit; font-weight: 800; }
  .marks { position: relative; }
  .marks .g { position: absolute; top: -8px; bottom: -8px; width: 1px; background: var(--grid); }
  .marks .g.z { background: var(--zero); }
  .mk { position: relative; height: 22px; }
  .mk b { position: absolute; top: 5px; height: 12px; min-width: 2px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(128,128,128,.55); }
  .mk em { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); padding: 0 4px; font-style: normal; font-size: 11px; font-weight: 800; line-height: 16px; color: var(--mu); background: var(--bg); }

  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 1050px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .draw { padding: 10px 12px 12px; }
  .stat { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--hair); background: var(--bg2); }
  .stat .k { font-size: 12px; color: var(--mu); white-space: nowrap; }
  .stat .v { font-size: 20px; font-weight: 800; font-family: Consolas, monospace; white-space: nowrap; }
  .stat .s { font-size: 12px; color: var(--mu); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px 16px; font-size: 12px; color: var(--tx2); margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>FLEXO <span>Plate travel</span></h1><span class="sp"></span><span class="pills" id="themes"></span></div>

  <div class="bar">
    <span class="cap">Cylinder <span class="pills" id="metal"></span></span>
    <span class="muted" id="stackline"></span>
    <span class="sp"></span>
    <span class="pills" id="lens"></span>
    <span class="pills" id="temps"></span>
  </div>

  <!-- The tooth count box is fixed markup, so typing in it is never redrawn; the rest of the row is drawn by update(). -->
  <div class="facts">
    <div class="fact teeth"><label class="k" for="teeth">Tooth count</label><input type="number" id="teeth" min="20" max="250" step="1"><div class="s" id="pitch"></div></div>
    <div id="facts-rest"></div>
  </div>

  <section class="panel">
    <div class="scroll"><div class="rows">
      <div class="frow hd"><div>Factor</div><div>Set to</div><div>Change</div><div><div class="axis" id="axis"></div></div><div style="text-align:right">End of repeat</div></div>

      <div class="frow">
        <div><div class="fname"><i style="background:var(--f-bcd)"></i>Cylinder BCD</div><div class="fstd" id="std-bcd"></div></div>
        <div><div class="ctl"><button type="button" class="nudge" data-nudge="dBcd" data-by="-1" aria-label="Smaller BCD">−</button><input type="range" id="dBcd" aria-label="Measured BCD"><button type="button" class="nudge" data-nudge="dBcd" data-by="1" aria-label="Larger BCD">+</button><output id="bcdOut"></output><button type="button" class="nudge" data-reset="dBcd" title="Back to standard" aria-label="Set the BCD back to standard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button></div></div>
        <div id="chg-bcd"></div><div><div class="marks" id="bar-bcd"></div></div><div id="trv-bcd"></div>
      </div>

      <div class="frow">
        <div><div class="fname"><i style="background:var(--f-temp)"></i>Cylinder temperature</div><div class="fstd">against when it was measured</div></div>
        <div><div class="ctl"><button type="button" class="nudge" data-nudge="dT" data-by="-1" aria-label="Colder">−</button><input type="range" id="dT" aria-label="Temperature change"><button type="button" class="nudge" data-nudge="dT" data-by="1" aria-label="Warmer">+</button><output id="dTout"></output><button type="button" class="nudge" data-reset="dT" title="Back to standard" aria-label="Set the temperature back to standard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button></div></div>
        <div id="chg-temp"></div><div><div class="marks" id="bar-temp"></div></div><div id="trv-temp"></div>
      </div>

      <div class="frow">
        <div><div class="fname"><i style="background:var(--f-plate)"></i>Plate thickness</div><div class="fstd" id="std-plate"></div></div>
        <div>
          <div class="ctl"><button type="button" class="nudge" data-nudge="plate" data-by="-1" aria-label="Thinner plate">−</button><input type="range" id="plate" aria-label="Plate thickness"><button type="button" class="nudge" data-nudge="plate" data-by="1" aria-label="Thicker plate">+</button><output id="plateOut"></output><button type="button" class="nudge" data-reset="plate" title="Back to standard" aria-label="Set the plate thickness back to standard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button></div>
          <div class="sub"><span class="pills" id="plate-picks"></span></div>
        </div>
        <div id="chg-plate"></div><div><div class="marks" id="bar-plate"></div></div><div id="trv-plate"></div>
      </div>

      <div class="frow">
        <div><div class="fname"><i style="background:var(--f-tape)"></i>Mounting tape</div><div class="fstd" id="std-tape"></div></div>
        <div>
          <div class="ctl"><button type="button" class="nudge" data-nudge="tape" data-by="-1" aria-label="Thinner tape">−</button><input type="range" id="tape" aria-label="Tape thickness"><button type="button" class="nudge" data-nudge="tape" data-by="1" aria-label="Thicker tape">+</button><output id="tapeOut"></output><button type="button" class="nudge" data-reset="tape" title="Back to standard" aria-label="Set the tape thickness back to standard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button></div>
          <div class="sub"><span class="pills" id="tape-picks"></span></div>
        </div>
        <div id="chg-tape"></div><div><div class="marks" id="bar-tape"></div></div><div id="trv-tape"></div>
      </div>
    </div></div>
  </section>

  <div class="two">
    <section class="panel">
      <div class="phead">
        <h2>At the end of the repeat</h2>
        <span class="sp"></span>
        <label class="ink" title="Ink opacity in the lens: lower it to see through overlapping inks">Ink <input type="range" id="alpha" min="20" max="100" step="5" aria-label="Ink opacity in the lens"><span class="mono" id="alphaOut" style="width:4ch;text-align:right"></span></label>
        <span class="pills" id="pats"></span>
      </div>
      <div class="draw"><div id="lensdraw"></div><div class="legend" id="lens-legend"></div></div>
    </section>
    <section class="panel">
      <div class="phead"><h2>The stack</h2><span class="muted">To scale through its thickness</span></div>
      <div class="stat" id="all-stat"></div>
      <div class="draw"><div id="stackdraw"></div><div class="legend" id="stack-legend"></div></div>
    </section>
  </div>
</div>

<script>
// Plate travel, on its own: one file, nothing loaded, nothing saved. It is the
// Travel tab of Plate Rolls without the app round it, and the maths is the
// app's (shared/plateCompare.js travelPrint). The standard stack is fixed here
// at the figures below; in the app it is the shop's Stack setup.
const TAU = 2 * Math.PI;
const STACK = { plate: 0.067, backing: 0.005, tape: 0.015, cp: 0.125 };           // the standard
const PICKS = { plate: [0.045, 0.067, 0.1, 0.107, 0.125], tape: [0.015, 0.02] };   // the Stack setup picks
const RANGE = { plate: [0.04, 0.13], tape: [0.01, 0.03] }, STEP = 0.0001; // both thickness sliders move in tenths of a thousandth
const GROWTH = { steel: 6.5e-6, aluminium: 13.1e-6 };                               // per °F, as shown on the type badge
const METAL = { steel: 'Steel', aluminium: 'Aluminium' };
const gear = (teeth) => {
  const R = teeth * STACK.cp, rp = R / TAU, K = TAU * (STACK.plate - STACK.backing);
  return { teeth, R, rp, K, dist: K / R, std: 2 * (rp - STACK.tape - STACK.plate) };
};
// What prints, with the cylinder dF warmer, this plate and this tape. The art is
// always made short for the plate in use.
const printed = (g, { dBcd = 0, dF = 0, metal = 'steel', plate = STACK.plate, tape = STACK.tape }) => {
  const bcd = (g.std + dBcd) * (1 + GROWTH[metal] * dF);
  const flat = g.R - TAU * (plate - STACK.backing);
  return (flat * g.rp) / (bcd / 2 + tape + STACK.backing);
};

// dBcd is the simulated reading against the standard BCD, which moves with the tooth count.
// It opens with every slider at the standard.
const state = { teeth: 71, metal: 'steel', dBcd: 0, dT: 0, plate: STACK.plate, tape: STACK.tape, pat: 'cross', alpha: 100, len: 'in', temp: 'F', theme: 'dark' };
const BCD_RANGE = 0.003, BCD_STEP = 0.00005;
const PATTERNS = [['cross', 'Crosshair'], ['mark', 'Register mark'], ['micro', 'Micro print'], ['ros175', 'Rosette 175'], ['ros300', 'Rosette 300'], ['circles', 'Micro circles']];
const LPI = { ros175: 175, ros300: 300 };
const $ = (id) => document.getElementById(id);

// ----- figures -----
const sgn = (v) => (v > 5e-7 ? '+' : v < -5e-7 ? '−' : '');
const way = (v) => (v > 5e-7 ? 'long' : v < -5e-7 ? 'short' : '');
const mm = () => state.len === 'mm';
const fLen = (v, d) => (mm() ? (v * 25.4).toFixed(d == null ? 3 : d) : v.toFixed(d == null ? 4 : d));
const sLen = (v, d) => sgn(v) + fLen(Math.abs(v), d);
const mark = () => (mm() ? ' mm' : '"');
const fineOf = (v) => (mm() ? v * 25400 : v * 1000), fineName = () => (mm() ? 'µm' : 'thou');
const fFine = (v) => { const a = Math.abs(fineOf(v)); return sgn(v) + (a < 10 ? a.toFixed(2) : a < 100 ? a.toFixed(1) : a.toFixed(0)); };
const dF = () => (state.temp === 'C' ? state.dT * 1.8 : state.dT);
const fTemp = (v) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}°${state.temp}`;
const btn = (group, value, on, label, cls = '') => `<button type="button" class="pill ${cls}${on ? ' on' : ''}" data-group="${group}" data-value="${value}" aria-pressed="${on}">${label}</button>`;
const near = (a, b) => Math.abs(a - b) < 1e-9;
const nearest = (list, want) => list.reduce((a, b) => (Math.abs(Math.log(b / want)) < Math.abs(Math.log(a / want)) ? b : a));

// ----- the pattern buttons, as on the Compare tab -----
const pLine = (body) => `<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const pDots = (pitch, r) => {
  let out = '';
  for (let row = -3; row <= 3; row++) for (let col = -3; col <= 3; col++) {
    const x = 10 + col * pitch + (row % 2 ? pitch / 2 : 0), y = 10 + row * pitch * 0.866;
    if (Math.hypot(x - 10, y - 10) <= 8.2) out += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}" fill="currentColor" stroke="none"/>`;
  }
  return out;
};
const PAT_ICON = {
  cross: () => pLine('<circle cx="10" cy="10" r="5.2"/><path d="M10 1.5v17M1.5 10h17"/>'),
  mark: () => pLine('<rect x="3" y="3" width="14" height="14"/><path d="M3 10h14M10 3v14M3 3l14 14"/>'),
  micro: () => '<svg width="24" height="18" viewBox="0 0 26 20" aria-hidden="true" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-weight="700"><text x="0" y="16" font-size="15">A</text><text x="11.5" y="16" font-size="10.5">A</text><text x="19.5" y="16" font-size="7">A</text></svg>',
  ros175: () => pLine(pDots(5.6, 1.9)),
  ros300: () => pLine(pDots(3.3, 1.05)),
  circles: () => pLine([-1, 0, 1].map(a => [-1, 0, 1].map(b => `<circle cx="${10 + a * 6}" cy="${10 + b * 6}" r="1.9" stroke-width="1.3"/>`).join('')).join('')),
};

// ----- the drawings -----
// The lens and its six patterns are the Compare tab's own (PlateCompare.js
// lensParts): geometry in micrometres, Z screen pixels per micrometre. The
// standard is the grey mark, which the opacity slider leaves alone and the
// rosettes do not draw; everything else handed in prints as an ink.
const UM = 25400, LW = 100, MARK_BOX = 0.125 * UM, MARK_LINE = 0.0075 * UM, MARK_TICK = 0.04 * UM, MARK_AT = MARK_BOX / 2 - 0.02 * UM;
const RING_OD = 0.04 * UM, RING_BORDER = 0.01 * UM, RING_PITCH = 0.06 * UM;
const lensHalf = (pat, maxEnd) => (pat === 'cross' ? Math.max(maxEnd * 1.3 + LW, 320)
  : pat === 'mark' ? MARK_BOX * 0.85 + maxEnd
    : pat === 'micro' ? 3000
      : pat === 'circles' ? Math.max(2000, maxEnd + 2 * RING_OD)
        : Math.max(900, 2 * maxEnd));
const ringPath = (x, y, r0, r1) => `M${x - r1},${y} a${r1},${r1} 0 1,0 ${2 * r1},0 a${r1},${r1} 0 1,0 ${-2 * r1},0 Z M${x - r0},${y} a${r0},${r0} 0 1,1 ${2 * r0},0 a${r0},${r0} 0 1,1 ${-2 * r0},0 Z`;
const lensMarks = (marks, pat, Z, cx, cy, r, teeth, tag = '') => {

const lensSvg = (marks, pat, teeth) => {

    <text x="${cx + r + 14}" y="${cy + 4}" font-size="12" font-weight="700" fill="var(--mu)">long ▶</text>

const stackSvg = (g, set) => {

// ----- everything that follows the controls -----

// ----- the sliders stay put while everything else is redrawn -----

    setSliders(); update(); return;
  }
  const b = e.target.closest('button[data-group]');
  if (!b) return;
  const { group, value } = b.dataset;
  if (group === 'temp' && value !== state.temp) state.dT = Math.round(value === 'C' ? state.dT / 1.8 : state.dT * 1.8);
  state[group] = group === 'plate' || group === 'tape' ? Number(value) : value;
  setSliders(); update();
});

const hash = window.location.hash.slice(1).split(',');
if (hash.includes('light')) state.theme = 'light';
if (hash.includes('mm')) state.len = 'mm';
if (hash.includes('celsius')) { state.temp = 'C'; state.dT = 8; }
if (hash.includes('alu')) state.metal = 'aluminium';
// #example dials in the small example the demo page's screenshot was taken with.
if (hash.includes('example')) Object.assign(state, { dBcd: 0.0002, dT: 15, plate: 0.0675, tape: 0.016 });
const hp = PATTERNS.find(p => hash.includes(p[0]));
if (hp) state.pat = hp[0];
if (hash.includes('thin')) state.plate = 0.045;
setSliders(); update();
</script>
</body>
</html>
