<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLEXO Plate travel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* the app's ThemeContext palette and the Plate Rolls hairlines */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --bg2: #1a1a1a; --hair: #333; --hair2: #555;
    --tx: #ffffff; --tx2: #e5e5e5; --mu: #a3a3a3; --pri: #3b82f6; --on: rgba(59,130,246,.16);
    --warn: #fbbf24; --grid: rgba(255,255,255,.10); --zero: #d4d4d4;
    --steel: #6d7076; --tape: #b5814d; --backing: #b8ae6a; --polymer: #4f8e79; --pitch: #f87171;
    --f-bcd: #38bdf8; --f-temp: #f472b6; --f-plate: #4ade80; --f-tape: #fb923c; --f-all: #e2e0da;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --bg2: #f5f5f5; --hair: #d4d4d4; --hair2: #a3a3a3;
    --tx: #1a1a1a; --tx2: #333333; --mu: #666666; --on: rgba(59,130,246,.14);
    --warn: #b45309; --grid: rgba(0,0,0,.10); --zero: #404040;
    --steel: #9a9ca1; --tape: #e8b27a; --backing: #f2e9a8; --polymer: #7fb7a4; --pitch: #c02626;
    --f-bcd: #00a3e0; --f-temp: #e4007c; --f-plate: #2e9e4f; --f-tape: #f07d1a; --f-all: #2b2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
  .muted { color: var(--mu); font-size: 12px; }
  .sp { flex: 1; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }

  .page { padding: 14px 18px 28px; max-width: 1500px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .head h1 span { margin-left: 8px; font-weight: 400; letter-spacing: 0; color: var(--mu); }

  .pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--hair); background: transparent; color: var(--tx2); white-space: nowrap; }
  .pill.on { border-color: var(--pri); background: var(--on); color: var(--tx); }
  .pill.sm { height: 24px; padding: 0 8px; font-size: 12px; }
  .pill.icon { padding: 0 6px; min-width: 32px; gap: 6px; }
  .pill.icon small { font-size: 11px; font-weight: 800; font-family: Consolas, monospace; }
  .pill svg { display: block; flex: none; }
  .ink { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--tx2); }
  .ink input { width: 110px; margin: 0; accent-color: var(--pri); }
  .cap { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--mu); }

  /* the top row: the tooth count in its own box, then the repeat, the standard BCD,
     the distortion both ways, and the four factors together in one box */
  .facts { display: grid; grid-template-columns: 150px minmax(140px, 1fr) minmax(140px, 1fr) minmax(200px, 1.25fr) minmax(600px, 4fr) auto; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  #facts-rest { display: contents; }
  .fact { padding: 9px 12px; min-width: 0; background: var(--bg); }
  .fact.key { background: var(--bg2); }
  .fact .k { display: block; font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact .v { font-size: 20px; font-weight: 800; font-family: Consolas, monospace; white-space: nowrap; }
  .fact .v .hi { margin-left: 12px; color: var(--mu); }
  .fact .s { font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact.teeth input { display: block; width: 92px; height: 28px; padding: 0 6px; border: 1px solid var(--hair2); border-radius: 6px; background: var(--bg2); color: var(--tx); font-family: Consolas, monospace; font-size: 20px; font-weight: 800; }
  .fact.four .each { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 12px; }
  .fact.four .k i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  /* the units close the first line of the row, one pair over the other, whatever the row folds to */
  /* its cell is never narrower than its buttons, and the row folds before the boxes beside it would have to give */
  .fact.units { grid-column: -2 / -1; grid-row: 1; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; min-width: max-content; }
  .fact.units .pills { flex-wrap: nowrap; }
  @media (max-width: 1380px) { .facts { grid-template-columns: repeat(4, minmax(0,1fr)) auto; } .fact.four { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .facts { grid-template-columns: repeat(2, minmax(0,1fr)); } .fact.four .each { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; } .fact.units { grid-column: 1 / -1; grid-row: auto; flex-direction: row; justify-content: flex-start; } }

  .panel { border: 1px solid var(--hair); border-radius: 8px; min-width: 0; margin-bottom: 12px; }
  .phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--hair); }
  .phead h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--mu); }

  /* the factor rows */
  .scroll { overflow-x: auto; }
  .rows { min-width: 1120px; }
  .frow { display: grid; grid-template-columns: 196px minmax(300px, 1fr) 176px minmax(260px, 1.15fr) 176px; align-items: center; border-bottom: 1px solid var(--hair); }
  .frow:last-child { border-bottom: 0; }
  .frow > div { padding: 8px 10px; min-width: 0; }
  .frow.hd > div { padding: 5px 10px; font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--mu); white-space: nowrap; }
  .fname { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .fname i { flex: none; width: 12px; height: 12px; border-radius: 3px; }
  .fstd { font-size: 12px; color: var(--mu); margin-left: 20px; white-space: nowrap; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl input[type=range] { flex: 1; min-width: 90px; margin: 0; accent-color: var(--pri); }
  .ctl output { width: 9ch; text-align: right; font-family: Consolas, monospace; font-weight: 800; font-size: 15px; white-space: nowrap; }
  .nudge { width: 26px; height: 26px; padding: 0; border: 1px solid var(--hair); border-radius: 6px; background: transparent; cursor: pointer; font-size: 16px; font-weight: 700; line-height: 1; }
  .nudge { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .nudge:disabled { opacity: .3; cursor: default; }
  /* a reset is amber while its slider is off the standard, and plain grey when there is nothing to reset */
  .nudge[data-row-reset], .nudge[data-face-reset] { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .nudge[data-row-reset]:disabled, .nudge[data-face-reset]:disabled { color: var(--mu); border-color: var(--hair); background: transparent; }
  .sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ln { display: flex; align-items: center; gap: 6px; height: 22px; white-space: nowrap; font-size: 13px; }
  .ln .who { width: 72px; font-size: 12px; color: var(--mu); }
  .ln.pick .who { color: var(--tx); font-weight: 800; }
  .ln .fig { font-family: Consolas, monospace; font-variant-numeric: tabular-nums; }
  .ln small { font-size: 12px; color: var(--mu); }
  .right { justify-content: flex-end; }
  .axis { position: relative; height: 26px; }
  .axis > span { position: absolute; top: 12px; transform: translateX(-50%); font-family: Consolas, monospace; font-size: 11px; font-weight: 400; letter-spacing: 0; }
  .axis .t { top: 0; left: 50%; font-family: inherit; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
  .axis .l { top: 0; left: 0; transform: none; font-family: inherit; font-weight: 800; }
  .axis .r { top: 0; left: auto; right: 0; transform: none; font-family: inherit; font-weight: 800; }
  .marks { position: relative; }
  .marks .g { position: absolute; top: -8px; bottom: -8px; width: 1px; background: var(--grid); }
  .marks .g.z { background: var(--zero); }
  .mk { position: relative; height: 22px; }
  .mk b { position: absolute; top: 5px; height: 12px; min-width: 2px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(128,128,128,.55); }
  .mk em { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); padding: 0 4px; font-style: normal; font-size: 11px; font-weight: 800; line-height: 16px; color: var(--mu); background: var(--bg); }

  .two { display: grid; gap: 12px; }
  .draw { padding: 10px 12px 12px; }
  .stat { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--hair); background: var(--bg2); }
  .stat .k { font-size: 12px; color: var(--mu); white-space: nowrap; }
  .stat .v { font-size: 20px; font-weight: 800; font-family: Consolas, monospace; white-space: nowrap; }
  .stat .s { font-size: 12px; color: var(--mu); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px 16px; font-size: 12px; color: var(--tx2); margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  /* Across the face: the four BCD readings and the plate width, then what they do to the sheet */
  .facebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 9px 12px; border-bottom: 1px solid var(--hair); }
  .facebar[hidden], .facestats[hidden], .stat[hidden] { display: none; }
  .facebar .top { flex: 1 0 100%; display: flex; align-items: center; gap: 10px; }
  .wd { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; font-size: 13px; font-weight: 700; color: var(--tx2); }
  .wd[hidden] { display: none; }
  .wd input { width: 84px; height: 28px; padding: 0 6px; border: 1px solid var(--hair2); border-radius: 6px; background: var(--bg2); color: var(--tx); font-family: Consolas, monospace; font-size: 15px; font-weight: 800; }
  .wd span { width: 3ch; color: var(--mu); }
  /* One place to set things, on the left, and what they do beside it. The set panel stays in view while the result scrolls. */
  .two { grid-template-columns: 600px minmax(0, 1fr); align-items: start; }
  @media (min-width: 1201px) { .set { position: sticky; top: 8px; } }
  @media (max-width: 1200px) { .two { grid-template-columns: minmax(0, 1fr); } }
  /* the four factors: a list to pick from, and what each does alone */
  /* the last column is each factor's own reset, tucked at the end of its row */
  .rowhd, .frow2 { display: grid; grid-template-columns: 168px 116px minmax(0, 1fr) 118px 40px; align-items: center; }
  .frow2 > .rst { padding-left: 0; }
  .rowhd { border-bottom: 1px solid var(--hair); }
  .rowhd > div { padding: 5px 10px; min-width: 0; font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--mu); white-space: nowrap; }
  .frow2 { width: 100%; padding: 0; border-width: 0 0 1px 3px; border-style: solid; border-color: transparent transparent var(--hair) transparent; background: transparent; text-align: left; cursor: pointer; }
  .frow2:hover { background: var(--bg2); }
  .frow2.on { background: var(--on); border-left-color: var(--ink); }
  .frow2 > div { padding: 7px 10px; min-width: 0; }
  .frow2 .fig { font-family: Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 800; white-space: nowrap; }
  .frow2 small { display: block; font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow2 .end { text-align: right; }
  /* the factor in hand as a whole: one slider, and a slot for its picks that is there whether it has any or not */
  .whole { padding: 10px 12px 8px; border-bottom: 1px solid var(--hair); background: var(--bg2); }
  .whole .cap { flex: none; }
  .whole .sub { min-height: 24px; }
  .cylbox { padding: 8px 10px 10px; border-bottom: 1px solid var(--hair); }
  .set .facebar { border-bottom: 0; }
  .pill i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
  #cylsvg [data-h] { cursor: ns-resize; outline: none; }
  #cylsvg [data-h]:focus-visible + circle { stroke: var(--pri); stroke-width: 3; }
  .fsteps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 4px; }
  .fstep { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 3px; }
  .fstep .nudge { width: 24px; height: 24px; }
  .fstep output { width: 8.5ch; text-align: center; font-family: Consolas, monospace; font-size: 13px; font-weight: 800; white-space: nowrap; }
  /* four figures: two by two beside The stack, in one row with the whole width, one column on a phone */
  .facestats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--hair); border-bottom: 1px solid var(--hair); }
  .facestats .stat { border-bottom: 0; align-content: flex-start; }
  .facestats .stat .s { white-space: normal; }
  @media (min-width: 1380px) { .facestats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .facestats { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>FLEXO <span>Plate travel</span></h1><span class="sp"></span><span class="pills" id="themes"></span></div>

  <!-- The tooth count box is fixed markup, so typing in it is never redrawn; the rest of the row is drawn by update().
       The units the page reads in close the row: inches or millimetres, and °F or °C. -->
  <div class="facts">
    <div class="fact teeth"><label class="k" for="teeth">Tooth count</label><input type="number" id="teeth" min="20" max="250" step="1"><div class="s" id="pitch"></div></div>
    <div id="facts-rest"></div>
    <div class="fact units"><span class="pills" id="lens"></span><span class="pills" id="temps"></span></div>
  </div>

  <!-- One place to set things, on the left, and what they do, on the right.
       The four factors are a list to pick from: the one picked is in hand. Under
       the list, one slider moves the factor in hand as a whole, and the cut
       through the cylinder moves it at each of four readings across the face.
       The slider, the drawing and the steppers are fixed markup, so nothing
       being dragged or typed is ever redrawn; the list is drawn by update(). -->
  <div class="two" id="two">
    <section class="panel set">
      <div class="rowhd"><div>Factor</div><div>Set to</div><div><div class="axis" id="axis"></div></div><div style="text-align:right">End of repeat</div><div></div></div>
      <div id="rows"></div>
      <div class="whole">
        <div class="ctl"><span class="cap" id="wholeCap"></span><button type="button" class="nudge" data-whole="-1" aria-label="Down">−</button><input type="range" id="whole" aria-label="The factor in hand, as a whole"><button type="button" class="nudge" data-whole="1" aria-label="Up">+</button><output id="wholeOut"></output></div>
        <div class="sub"><span class="pills" id="picks"></span></div>
      </div>

      <div class="cylbox"><div id="facecyl"></div><div class="fsteps" id="facesteps"></div></div>
      <div class="facebar">
        <div class="top"><span class="cap">Plate <span class="pills" id="flexes"></span></span></div>
      </div>
    </section>

    <section class="panel">
      <div class="phead">
        <h2>At the end of the repeat</h2>
        <span class="pills" id="shows"></span>
        <span class="sp"></span>
        <label class="ink" title="Ink opacity in the lens: lower it to see through overlapping inks">Ink <input type="range" id="alpha" min="20" max="100" step="5" aria-label="Ink opacity in the lens"><span class="mono" id="alphaOut" style="width:4ch;text-align:right"></span></label>
        <span class="pills" id="pats"></span>
        <!-- The plate width belongs to the sheet, so it shows only when the sheet does. Fixed markup, so typing in it is never redrawn. -->
        <label class="wd" id="widthbar" hidden>Plate width <input type="number" id="width" step="any" aria-label="Plate width"><span id="widthUnit"></span></label>
      </div>
      <div class="stat" id="all-stat"></div>
      <div class="facestats" id="face-stat" hidden></div>
      <div class="draw"><div id="lensdraw"></div><div class="legend" id="lens-legend"></div></div>
    </section>
  </div>
</div>

<script>
// Plate travel, on its own: one file, nothing loaded, nothing saved. It is the
// Travel tab of Plate Rolls without the app round it, and the maths is the
// app's (shared/plateCompare.js travelPrint). The standard stack is fixed here
// at the figures below; in the app it is the shop's Stack setup.
const TAU = 2 * Math.PI;
const STACK = { plate: 0.067, backing: 0.005, tape: 0.015, cp: 0.125 };           // the standard
const PICKS = { plate: [0.045, 0.067, 0.1, 0.107, 0.125], tape: [0.015, 0.02] };   // the Stack setup picks
const RANGE = { plate: [0.04, 0.13], tape: [0.01, 0.03] }, STEP = 0.0001; // both thickness sliders move in tenths of a thousandth
const GROWTH = { steel: 6.5e-6, aluminium: 13.1e-6 };                               // per °F, as shown on the type badge
const METAL = { steel: 'Steel', aluminium: 'Aluminium' };
const gear = (teeth) => {
  const R = teeth * STACK.cp, rp = R / TAU, K = TAU * (STACK.plate - STACK.backing);
  return { teeth, R, rp, K, dist: K / R, std: 2 * (rp - STACK.tape - STACK.plate) };
};
// What prints, with the cylinder dF warmer, this plate and this tape. The art is
// always made short for the plate in use.
const printed = (g, { dBcd = 0, dF = 0, metal = 'steel', plate = STACK.plate, tape = STACK.tape }) => {
  const bcd = (g.std + dBcd) * (1 + GROWTH[metal] * dF);
  const flat = g.R - TAU * (plate - STACK.backing);
  return (flat * g.rp) / (bcd / 2 + tape + STACK.backing);
};

// dBcd is the simulated reading against the standard BCD, which moves with the tooth count.
// It opens with every slider at the standard.
// `face` holds four simulated readings across the face for each of the three
// things that can differ from one edge of the plate to the other: the
// cylinder's BCD, the tape and the plate. Each is against its own row above,
// and the four are evenly spaced from edge to edge. Temperature is one figure
// for the whole cylinder. `hand` is the factor in hand: bcd, temp, plate or
// tape. `width` is the plate's width in inches.
const state = { teeth: 71, metal: 'steel', dBcd: 0, dT: 0, plate: STACK.plate, tape: STACK.tape, face: { bcd: [0, 0, 0, 0], tape: [0, 0, 0, 0], plate: [0, 0, 0, 0] }, hand: 'bcd', width: 13, flex: 'stiff', pat: 'cross', alpha: 100, show: 'all', len: 'in', temp: 'F', theme: 'dark' };
const BCD_RANGE = 0.003, BCD_STEP = 0.00005;
const WIDTH_RANGE = [2, 80];
const CATS = {
  // every reading has the same reach in height: 0.003" either way (REACH, where the drawing is made). The BCD is a diameter, so it reads twice that.
  bcd: { name: 'BCD', ink: 'var(--f-bcd)', lim: 0.006, step: BCD_STEP },
  tape: { name: 'Tape', ink: 'var(--f-tape)', lim: 0.003, step: STEP },
  plate: { name: 'Plate', ink: 'var(--f-plate)', lim: 0.003, step: STEP },
};
const PATTERNS = [['cross', 'Crosshair'], ['mark', 'Register mark'], ['micro', 'Micro print'], ['ros175', 'Rosette 175'], ['ros300', 'Rosette 300'], ['circles', 'Micro circles']];
const LPI = { ros175: 175, ros300: 300 };
const $ = (id) => document.getElementById(id);
const RESET_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';

// ----- figures -----
const sgn = (v) => (v > 5e-7 ? '+' : v < -5e-7 ? '−' : '');
const way = (v) => (v > 5e-7 ? 'long' : v < -5e-7 ? 'short' : '');
const mm = () => state.len === 'mm';
const fLen = (v, d) => (mm() ? (v * 25.4).toFixed(d == null ? 3 : d) : v.toFixed(d == null ? 4 : d));
const sLen = (v, d) => sgn(v) + fLen(Math.abs(v), d);
const mark = () => (mm() ? ' mm' : '"');
const fineOf = (v) => (mm() ? v * 25400 : v * 1000), fineName = () => (mm() ? 'µm' : 'thou');
const fFine = (v) => { const a = Math.abs(fineOf(v)); return sgn(v) + (a < 10 ? a.toFixed(2) : a < 100 ? a.toFixed(1) : a.toFixed(0)); };
const dF = () => (state.temp === 'C' ? state.dT * 1.8 : state.dT);
const fTemp = (v) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}°${state.temp}`;
const btn = (group, value, on, label, cls = '') => `<button type="button" class="pill ${cls}${on ? ' on' : ''}" data-group="${group}" data-value="${value}" aria-pressed="${on}">${label}</button>`;
const near = (a, b) => Math.abs(a - b) < 1e-9;
const nearest = (list, want) => list.reduce((a, b) => (Math.abs(Math.log(b / want)) < Math.abs(Math.log(a / want)) ? b : a));

// ----- the pattern buttons, as on the Compare tab -----
const pLine = (body) => `<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const pDots = (pitch, r) => {
  let out = '';
  for (let row = -3; row <= 3; row++) for (let col = -3; col <= 3; col++) {
    const x = 10 + col * pitch + (row % 2 ? pitch / 2 : 0), y = 10 + row * pitch * 0.866;

    ['var(--f-temp)', `Each ${unitT}°${state.temp}, ${METAL[state.metal].toLowerCase()}`, fFine(tr({ dF: unitF, metal: state.metal }))],
    ['var(--f-tape)', mm() ? 'Each 0.01 mm of tape' : 'Each 0.001" of tape', fFine(-perRad * (mm() ? 0.01 / 25.4 / 0.001 : 1))],
    ['var(--f-plate)', mm() ? 'Each 0.01 mm of plate' : 'Each 0.001" of plate', fFine(tr({ plate: STACK.plate + (mm() ? 0.01 / 25.4 : 0.001) }))],
  ];
  $('pitch').textContent = `${cp} circular pitch`;
  $('facts-rest').innerHTML = tile('Repeat', `${fLen(R)}${mark()}`, `${g.teeth} teeth × ${cp} CP`)
    + tile('Standard BCD', fLen(g.std), `pitch − 2 × ${fLen(STACK.plate + STACK.tape, 3)}`, true)
    // the distortion both ways: how much shorter the plate is made, and what is left of the repeat
    + tile('Distortion', `<span title="How much shorter the plate is made">${pct.toFixed(3)}%</span><span class="hi" title="The plate's length as a share of the repeat">${(100 - pct).toFixed(3)}%</span>`, `plate made ${fLen(g.K)}${mark()} short`, true)
    + `<div class="fact four"><div class="each">${each.map(([ink, k, v]) => `<div><div class="k"><i style="background:${ink}"></i>${k}</div><div class="v">${v}</div></div>`).join('')}</div><div class="s">${fineName()} at the end of the repeat</div></div>`;

  // the shared travel scale: every bar on one axis
  const steps = mm() ? [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000] : [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
  const most = Math.max(...Object.values(one).map(v => Math.abs(fineOf(v))));
  const lim = steps.find(x => x >= most * 1.02) || steps[steps.length - 1];
  const X = (v) => 50 + Math.max(-1.08, Math.min(1.08, fineOf(v) / lim)) * 46;
  const ticks = [-lim, 0, lim];
  const tl = (t) => (t === 0 ? '0' : `${t > 0 ? '+' : '−'}${Number(Math.abs(t).toFixed(2))}`);
  $('axis').innerHTML = `<span class="l">◀ Short</span><span class="t" style="text-transform:none">${fineName()}</span><span class="r">Long ▶</span>${ticks.map(t => `<span style="left:${50 + (t / lim) * 46}%">${tl(t)}</span>`).join('')}`;
  const grid = ticks.map(t => `<i class="g${t === 0 ? ' z' : ''}" style="left:${50 + (t / lim) * 46}%"></i>`).join('');
  const mk = (v, ink) => (way(v) ? `<div class="mk"><b style="left:${Math.min(50, X(v))}%;width:${Math.abs(X(v) - 50)}%;background:${ink}"></b></div>` : '<div class="mk"><em>none</em></div>');

  // The four factors, a list to pick from: the one picked is in hand. A row
  // gives what the factor is set to as a whole, whether it differs across the
  // face, and what it does alone at the end of the repeat.
  const rd = mm() ? 4 : 5, dPlate = state.plate - STACK.plate, dTape = state.tape - STACK.tape;
  const uneven = (k) => !!F[k] && F[k].some(v => !near(v, 0)), off = (v, up, down, d) => (way(v) ? `${sLen(v, d)} ${v > 0 ? up : down}` : 'standard');
  const end = (v) => `<div class="fig">${way(v) ? sLen(v) : fLen(0)}${mark()}</div><small>${way(v) ? `${fFine(v).replace(/^[+−]/, '')} ${fineName()} ${way(v)}` : 'no travel'}</small>`;
  const rows = [
    { key: 'bcd', name: 'Cylinder BCD', ink: 'var(--f-bcd)', set: fLen(g.std + state.dBcd, rd), chg: off(state.dBcd, 'larger', 'smaller', rd), v: one.bcd },
    { key: 'temp', name: 'Temperature', note: `${METAL[state.metal].toLowerCase()} cylinder`, ink: 'var(--f-temp)', set: fTemp(state.dT), chg: `BCD ${sLen(grow(state.metal), rd)}`, v: one[state.metal] },
    { key: 'plate', name: 'Plate thickness', ink: 'var(--f-plate)', set: fLen(state.plate), chg: off(dPlate, 'thicker', 'thinner'), v: one.plate },
    { key: 'tape', name: 'Mounting tape', ink: 'var(--f-tape)', set: fLen(state.tape), chg: off(dTape, 'thicker', 'thinner'), v: one.tape },
  ];
  // Each row ends in its own reset, which puts that factor back to standard
  // altogether: as a whole, and at each reading across the face. It is live
  // only when there is something to put back, and keeps its slot either way.
  // A row cannot be a button with a button inside it, so it is a block that
  // acts as one.
  const offStd = (key) => !near(state[WHOLE[key]], STANDARD[WHOLE[key]]) || uneven(key);
  $('rows').innerHTML = rows.map(r => `<div role="button" tabindex="0" class="frow2${state.hand === r.key ? ' on' : ''}" data-group="hand" data-value="${r.key}" aria-pressed="${state.hand === r.key}" style="--ink:${r.ink}">
    <div><div class="fname"><i style="background:${r.ink}"></i>${r.name}</div><div class="fstd">${uneven(r.key) ? 'differs across the face' : r.note || '&nbsp;'}</div></div>
    <div><div class="fig">${r.set}</div><small>${r.chg}</small></div>
    <div><div class="marks">${grid}${mk(r.v, r.ink)}</div></div>
    <div class="end">${end(r.v)}</div>
    <div class="rst"><button type="button" class="nudge" data-row-reset="${r.key}" title="Back to standard" aria-label="Set ${r.name} back to standard"${offStd(r.key) ? '' : ' disabled'}>${RESET_ICON}</button></div>
  </div>`).join('');

  // The factor in hand, as a whole: the one slider, what it reads, and its
  // picks. The picks are the plate and tape thicknesses of the Stack setup,
  // and for the temperature the metal the cylinder is made of.
  $('wholeCap').textContent = 'Whole';
  $('wholeOut').textContent = { bcd: fLen(g.std + state.dBcd, rd), temp: fTemp(state.dT), plate: fLen(state.plate), tape: fLen(state.tape) }[state.hand];
  $('picks').innerHTML = state.hand === 'temp' ? Object.keys(METAL).map(mt => btn('metal', mt, state.metal === mt, METAL[mt], 'sm')).join('')
    : PICKS[state.hand] ? PICKS[state.hand].map(v => btn(state.hand, v, near(state[state.hand], v), fLen(v, 3), 'sm')).join('') : '';

  // all four together, for the cylinder type picked: one figure over the lens
  const tot = all[state.metal];
  $('all-stat').innerHTML = `<span class="k">All together, ${METAL[state.metal].toLowerCase()}</span><span class="v">${way(tot) ? `${sLen(tot)}${mark()}` : `${fLen(0)}${mark()}`}</span><span class="s">${way(tot) ? `${fFine(tot).replace(/^[+−]/, '')} ${fineName()} ${way(tot)} at the end of the repeat` : 'no travel'} · prints ${fLen(R + tot)}${mark()}</span>`;

  // the lens: the four changes together, in black, against the grey standard,
  // or each change alone in a lens of its own. In a rosette the black screen
  // carries the travel and cyan, magenta and yellow sit at zero.
  const marks = [
    STD_MARK,
    { name: `All together, ${METAL[state.metal].toLowerCase()}`, ...BLACK, off: all[state.metal] },
  ];
  // Each change alone, in the order of the rows above, in the ink nearest its row's colour square.
  const alone = [
    { key: 'bcd', name: 'Cylinder BCD', color: 'var(--f-bcd)', ink: '#00a3e0', k: 'C', ang: 15, off: one.bcd },
    { key: 'temp', name: `Temperature, ${METAL[state.metal].toLowerCase()}`, color: 'var(--f-temp)', ink: '#e4007c', k: 'M', ang: 75, off: one[state.metal] },
    { key: 'plate', name: 'Plate thickness', color: 'var(--f-plate)', ink: '#2e9e4f', k: 'G', ang: 60, off: one.plate },
    { key: 'tape', name: 'Mounting tape', color: 'var(--f-tape)', ink: '#f07d1a', k: 'O', ang: 30, off: one.tape },
  ];
  const quad = state.show === 'each', across = state.show === 'face';
  $('shows').innerHTML = [['all', 'All together'], ['each', 'Each'], ['face', 'Across the face']].map(([v, l]) => btn('show', v, state.show === v, l)).join('');
  $('alphaOut').textContent = `${state.alpha}%`;
  $('pats').innerHTML = PATTERNS.map(([v, label]) => `<button type="button" class="pill icon${state.pat === v ? ' on' : ''}" data-group="pat" data-value="${v}" aria-pressed="${state.pat === v}" title="${label}" aria-label="${label}">${PAT_ICON[v]()}${LPI[v] ? `<small>${LPI[v]}</small>` : ''}</button>`).join('');
  // Across the face: everything as set, at each of the four readings. The tail
  // edge is out of square by what the two edges differ, it bows by what the
  // two readings between them stand off the straight line from edge to edge,
  // and each diagonal runs from a lead corner to the far tail corner.
  $('all-stat').hidden = across;
  $('widthbar').hidden = !across;
  $('face-stat').hidden = !across;
  $('widthUnit').textContent = mm() ? 'mm' : 'in';
  drawCyl(rd, g, ((g.std + state.dBcd) * (1 + GROWTH[state.metal] * dF()) - g.std) / 2 + dTape + dPlate);
  // The plate, two ways, and a real one lies between them.
  // Follows: it gives enough to sit on the cylinder as it is, so each reading
  // prints its own length and nothing moves across.
  // Stiff: it will not stretch, so it cannot follow four readings that are not
  // in line. It sits on the straight taper nearest all four (least squares),
  // which is how the two readings in between come to move the corners. On a
  // taper a flat sheet laid square at the lead edge does not run true: it
  // winds round as a slight spiral toward the large end, by
  // length² × taper ÷ (2 × radius) at the tail, both taken at the backing.
  $('flexes').innerHTML = [['stiff', 'Stiff', 'The plate does not stretch: it sits on the straight taper nearest the four readings, and winds toward the large end'], ['follows', 'Follows', 'The plate gives: each reading prints its own length, and nothing moves across']]
    .map(([v, l, tip]) => `<button type="button" class="pill sm${state.flex === v ? ' on' : ''}" data-group="flex" data-value="${v}" aria-pressed="${state.flex === v}" title="${tip}">${l}</button>`).join('');
  if (across) {
    // What sets the length is the radius of the backing line, and at each
    // reading that is the cylinder as it measures there with the tape as it is
    // there on top. The plate's thickness at a reading counts there the way
    // the plate's thickness counts as a whole, by the page's one rule for a
    // plate: the art is as short as that thickness asks for, so a plate that
    // is thicker at a reading prints shorter there. All three readings go
    // through the Stiff | Follows choice together, so the plate's is turned
    // into the radius that would print the same length (0.001" of plate comes
    // to 0.001" of radius, the same as the tape), and the taper, the lengths
    // and the sideways walk are worked from that one radius at each reading.
    const stiff = state.flex === 'stiff', xs = [-0.5, -1 / 6, 1 / 6, 0.5], heat = 1 + GROWTH[state.metal] * dF();
    const flat = R - TAU * (state.plate - STACK.backing);
    const rb = xs.map((_, i) => (((g.std + state.dBcd + F.bcd[i]) * heat) / 2 + state.tape + F.tape[i] + STACK.backing) * flat / (flat - TAU * F.plate[i]));
    const mean = rb.reduce((s, r) => s + r, 0) / 4, slope = xs.reduce((s, x, i) => s + x * rb[i], 0) / xs.reduce((s, x) => s + x * x, 0);   // radius, edge to edge, along the nearest straight line
    const tf = (stiff ? xs.map(x => mean + slope * x) : rb).map(r => (flat * g.rp) / r - R);
    const side = stiff ? (flat * flat * (slope / state.width)) / (2 * mean) : 0;
    const skew = tf[3] - tf[0], dg = [Math.hypot(R + tf[3], state.width + side), Math.hypot(R + tf[0], state.width - side)], dd = dg[0] - dg[1];
    // A stiff plate's tail edge is a straight line but for a hair (the length does not go quite evenly with the BCD), and a hair is not a bow.
    const bows = [1, 2].map(i => tf[i] - (tf[0] + (skew * i) / 3)), most = Math.abs(bows[0]) >= Math.abs(bows[1]) ? bows[0] : bows[1], bow = Math.abs(most) < 5e-6 ? 0 : most;
    const amt = (v) => `${fLen(way(v) ? Math.abs(v) : 0)}${mark()}`, fine = (v) => `${fFine(v).replace(/^[+−]/, '')} ${fineName()}`;
    const st = (k, v, s) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
    $('face-stat').innerHTML = st('Out of square', amt(skew), way(skew) ? `${fine(skew)}, side ${skew < 0 ? 4 : 1} short` : 'square')
      + st('Diagonals differ', amt(dd), `1 to 4 ${fLen(dg[0])}${mark()} · 4 to 1 ${fLen(dg[1])}${mark()}`)
      + st('Tail edge bow', amt(bow), way(bow) ? `${fine(bow)}, middle ${bow > 0 ? 'long' : 'short'}` : 'straight')
      + st('Tail sideways', amt(side), way(side) ? `${fine(side)}, toward side ${side > 0 ? 4 : 1}` : 'none');
    const drawn = faceSvg(tf, side, state.pat, g.teeth, R, state.width, true);
    $('lensdraw').innerHTML = drawn.svg;
    $('lens-legend').innerHTML = `<span><i style="background:${STD_MARK.ink}"></i><b>Standard</b></span><span><i style="background:${BLACK.ink}"></i><b>As set</b></span><span>Travel drawn <b class="mono">×${drawn.ex.toLocaleString('en-US')}</b>, figures in ${fineName()}</span>`;
  } else {
  $('lensdraw').innerHTML = quad ? quadSvg(alone, state.pat, g.teeth, 2) : lensSvg(marks, state.pat, g.teeth, true);
  // The rosettes draw no grey standard, so the legend leaves it out there. The
  // four lenses name their own changes, so only the standard is named under them.
  $('lens-legend').innerHTML = marks.filter(m => (m.std ? !LPI[state.pat] : !quad)).map(m => `<span>${!m.std && quad ? '' : `<i style="background:${m.ink}"></i>`}<b>${m.name}</b>${m.std ? '' : ` <span class="mono">${way(m.off) ? `${sLen(m.off)}${mark()}` : 'no travel'}</span>`}</span>`).join('');
  }
};

// ----- the sliders stay put while everything else is redrawn -----
// The cylinder across its face, under the one slider. It is cut along its
// length and seen from the front of the press: the cylinder, then the tape,
// the backing and the polymer over the width of the plate, with the four
// readings left to right. It is a diagram, drawn at two scales, and neither is
// true:
//   - how thick the tape and the plate are as a whole sets how thick their
//     layers are drawn (LAYER below), so a thicker plate looks thicker;
//   - anything measured in tenths of a thou is drawn at FS pixels to the inch
//     of height: what a reading is off by, and where the whole BCD and the
//     temperature put the cylinder's surface. That is the same for all three
//     layers, so a point moves under the pointer as it is dragged, and every
//     point has the same reach on the drawing: REACH either way, shown by a
//     pair of faint rails on the layer in hand.
// The face as the rows set it stands at FACE_Y, and the drawing grows downward
// as the layers thicken. Built once and then only moved, never redrawn, so a
// drag is not cut short; the same goes for the four steppers under it.
// The layers are drawn thick enough that the thinnest tape and the thinnest
// plate still show with a reading at the bottom of its reach.
const FX = [60, 180, 300, 420], FS = 10000, REACH = 0.003, FACE_Y = 46 + 3 * FS * REACH, BACK_PX = 8;
const LAYER = { tape: (t) => 42 + (t - STACK.tape) * 1000, plate: (p) => 60 + (p - STACK.plate) * 800 };
$('facecyl').innerHTML = `<svg id="cylsvg" width="100%" style="display:block;touch-action:none" role="group" aria-label="The cylinder, tape and plate across the face">
  <rect id="cy-j0" x="0" width="20" height="20" fill="var(--steel)" opacity=".65"/><rect id="cy-j1" x="460" width="20" height="20" fill="var(--steel)" opacity=".65"/>
  <polygon id="cy-steel" fill="var(--steel)"/><polygon id="cy-tape" fill="var(--tape)"/><polygon id="cy-back" fill="var(--backing)"/><polygon id="cy-poly" fill="var(--polymer)"/>
  <text id="cy-cap" x="4" y="14" font-size="11" font-weight="800" fill="var(--mu)">Face against the pitch line</text>
  <text id="cy-n-plate" x="120" text-anchor="middle" font-size="11" font-weight="700" fill="#111"></text><text id="cy-n-tape" x="120" text-anchor="middle" font-size="11" font-weight="700" fill="#111"></text><text id="cy-n-bcd" x="28" font-size="11" font-weight="700" fill="#111"></text>
  ${FX.map((x, i) => `<line id="cy-drop${i}" x1="${x}" x2="${x}" stroke="var(--tx)" stroke-opacity=".28" stroke-dasharray="2 3"/>
  <text id="cy-face${i}" x="${x}" y="30" font-size="11" class="mono" fill="var(--tx2)" text-anchor="middle"></text>
  <text id="cy-num${i}" x="${x}" font-size="12" font-weight="800" fill="var(--tx)" text-anchor="middle">${i + 1}</text>`).join('')}
  <polyline id="cy-max" fill="none" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6" pointer-events="none"/><polyline id="cy-min" fill="none" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6" pointer-events="none"/>
  ${Object.entries(CATS).map(([k, c]) => `<polyline id="cy-l-${k}" fill="none" stroke="${c.ink}" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/><polyline id="cy-p-${k}" data-group="hand" data-value="${k}" fill="none" stroke="transparent" stroke-width="16" stroke-linecap="round" pointer-events="stroke" style="cursor:pointer"><title>${c.name}: take it in hand</title></polyline>`).join('')}
  ${FX.map((x, i) => `<circle id="cy-hit${i}" data-h="${i}" cx="${x}" r="15" fill="transparent" tabindex="0" role="slider" aria-orientation="vertical"/><circle id="cy-h${i}" cx="${x}" r="7.5" stroke="var(--bg)" stroke-width="2" pointer-events="none"/>`).join('')}
</svg>`;
$('facesteps').innerHTML = FX.map((_, i) => `<div class="fstep"><button type="button" class="nudge" data-face="${i}" data-by="-1" aria-label="Reading ${i + 1} down">−</button><output id="fv${i}"></output><button type="button" class="nudge" data-face="${i}" data-by="1" aria-label="Reading ${i + 1} up">+</button><button type="button" class="nudge" data-face-reset="${i}" title="Back to none" aria-label="Set reading ${i + 1} back to none">${RESET_ICON}</button></div>`).join('');
// `lift` is how far the face stands off the pitch line before anything differs
// across the face: what the whole cylinder, the whole tape and the whole plate
// are off the standard by, added up. With the temperature in hand there are no
// points: it is one figure for the whole cylinder.
const drawCyl = (rd, g, lift) => {
  const F = state.face, cat = CATS[state.hand], pts = (ys) => FX.map((x, i) => `${x},${ys[i]}`);
  // The layers as the rows set them: the tape and the plate as thick as they
  // are as a whole, and the cylinder's surface where its whole BCD and its
  // temperature put it. Then each reading on top of that.
  const tapePx = LAYER.tape(state.tape), platePx = LAYER.plate(state.plate), y0 = FACE_Y + platePx + BACK_PX + tapePx, floor = y0 + 64;
  const base = y0 - (FS * ((g.std + state.dBcd) * (1 + GROWTH[state.metal] * dF()) - g.std)) / 2;
  const cyl = F.bcd.map(v => base - (FS * v) / 2), tape = cyl.map((y, i) => y - tapePx - FS * F.tape[i]), back = tape.map(y => y - BACK_PX), face = back.map((y, i) => y - platePx - FS * F.plate[i]);
  const band = (lo, hi) => [...pts(lo), ...pts(hi).reverse()].join(' ');
  // FACE_Y leaves room over the face for all three layers at the top of their
  // reach at one reading; a cylinder made larger as a whole lifts the lot, and
  // the drawing grows upward by as much, so nothing runs into the figures.
  const topY = Math.min(0, base - y0);
  $('cylsvg').setAttribute('viewBox', `0 ${topY} 480 ${floor + 28 - topY}`);
  $('cy-cap').setAttribute('y', topY + 14);
  FX.forEach((_, i) => $(`cy-face${i}`).setAttribute('y', topY + 30));
  for (const id of ['cy-j0', 'cy-j1']) $(id).setAttribute('y', floor - 20);
  $('cy-steel').setAttribute('points', `20,${floor} 20,${cyl[0]} ${pts(cyl).join(' ')} 460,${cyl[3]} 460,${floor}`);
  // the rails: as far as a point on the layer in hand can go, either way, from where the whole puts it
  const rest = { bcd: cyl.map(() => base), tape: cyl.map(y => y - tapePx), plate: back.map(y => y - platePx) }[state.hand];
  for (const [id, sg] of [['cy-max', -1], ['cy-min', 1]]) {
    $(id).setAttribute('display', cat ? 'inline' : 'none');
    if (cat) { $(id).setAttribute('points', pts(rest.map(y => y + sg * FS * REACH)).join(' ')); $(id).setAttribute('stroke', cat.ink); }
  }
  $('cy-tape').setAttribute('points', band(cyl, tape));
  $('cy-back').setAttribute('points', band(tape, back));
  $('cy-poly').setAttribute('points', band(back, face));
  // Every layer that can be set across the face wears a strip of its own
  // colour along its top edge, so all three can be seen to be there for the
  // taking: the one in hand is the heavy one with a point at each reading, and
  // a click on another takes that one in hand. The temperature has no strip:
  // it is one figure for the whole cylinder.
  const edge = { bcd: cyl, tape, plate: face }, top = edge[state.hand] || cyl;
  for (const k of Object.keys(CATS)) {
    for (const id of [`cy-l-${k}`, `cy-p-${k}`]) $(id).setAttribute('points', pts(edge[k]).join(' '));
    $(`cy-l-${k}`).setAttribute('stroke-width', state.hand === k ? 4.5 : 3);
    $(`cy-p-${k}`).setAttribute('display', state.hand === k ? 'none' : 'inline');
  }
  // each layer is named with what it is set to as a whole
  // (halfway between readings 1 and 2, in the middle of the layer there, clear of the points)
  Object.assign($('cy-n-plate'), { textContent: `Plate ${fLen(state.plate)}` }).setAttribute('y', (back[0] + face[0] + back[1] + face[1]) / 4 + 4);
  Object.assign($('cy-n-tape'), { textContent: `Tape ${fLen(state.tape)}` }).setAttribute('y', (cyl[0] + tape[0] + cyl[1] + tape[1]) / 4 + 4);
  Object.assign($('cy-n-bcd'), { textContent: `BCD ${fLen(g.std + state.dBcd, rd)}${way(dF()) ? `, ${fTemp(state.dT)}` : ''}` }).setAttribute('y', floor - 7);
  $('facesteps').style.visibility = cat ? 'visible' : 'hidden';
  FX.forEach((_, i) => {
    const v = cat ? F[state.hand][i] : 0, all = lift + F.bcd[i] / 2 + F.tape[i] + F.plate[i];
    $(`cy-drop${i}`).setAttribute('y1', face[i]); $(`cy-drop${i}`).setAttribute('y2', floor + 6);
    $(`cy-num${i}`).setAttribute('y', floor + 22);
    // how far the face stands off the pitch line at this reading
    $(`cy-face${i}`).textContent = sLen(all, rd);
    const dot = $(`cy-h${i}`), hit = $(`cy-hit${i}`);
    dot.setAttribute('cy', top[i]); hit.setAttribute('cy', top[i]);
    dot.setAttribute('display', cat ? 'inline' : 'none'); hit.setAttribute('display', cat ? 'inline' : 'none');
    if (!cat) return;
    dot.setAttribute('fill', cat.ink);
    hit.setAttribute('aria-label', `${cat.name} at reading ${i + 1}, against the whole`);
    hit.setAttribute('aria-valuenow', v); hit.setAttribute('aria-valuemin', -cat.lim); hit.setAttribute('aria-valuemax', cat.lim);
    $(`fv${i}`).textContent = sLen(v, rd);
    document.querySelector(`[data-face-reset="${i}"]`).disabled = near(v, 0);
  });
};
// A reading, kept to its range and to its step. Setting one turns the result
// to the sheet, where a difference across the face can be seen.
const setFace = (i, v) => {
  const c = CATS[state.hand];
  if (!c) return;
  state.face[state.hand][i] = Number(Math.max(-c.lim, Math.min(c.lim, Math.round(v / c.step) * c.step)).toFixed(5));
  state.show = 'face';
  update();
};
// A point is dragged up and down, or moved with the arrow keys. The BCD is a
// diameter and the drawing is a radius, so its point moves half of what it reads.
let drag = null;
$('cylsvg').addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-h]');
  if (!h || !CATS[state.hand]) return;
  const i = Number(h.dataset.h);
  drag = { i, y: e.clientY, v: state.face[state.hand][i], k: 480 / $('cylsvg').getBoundingClientRect().width };
  // held, so the drag carries on when the pointer leaves the point; without the hold it still works over the drawing
  try { h.setPointerCapture(e.pointerId); } catch (err) { /* no such pointer */ }
  h.focus(); e.preventDefault();
});
$('cylsvg').addEventListener('pointermove', (e) => { if (drag) setFace(drag.i, drag.v + (((drag.y - e.clientY) * drag.k) / FS) * (state.hand === 'bcd' ? 2 : 1)); });
for (const ev of ['pointerup', 'pointercancel']) $('cylsvg').addEventListener(ev, () => { drag = null; });
$('cylsvg').addEventListener('keydown', (e) => {
  const h = e.target.closest('[data-h]'), by = { ArrowUp: 1, ArrowDown: -1 }[e.key];
  if (!h || !by || !CATS[state.hand]) return;
  e.preventDefault();
  setFace(Number(h.dataset.h), state.face[state.hand][Number(h.dataset.h)] + by * CATS[state.hand].step);
});

// The one slider is the factor in hand as a whole, so its range and step are
// that factor's. It is set here, when the factor changes, and not while it is
// being dragged.
const WHOLE = { bcd: 'dBcd', temp: 'dT', plate: 'plate', tape: 'tape' };
const setSliders = () => {
  const lim = state.temp === 'C' ? 22 : 40, k = WHOLE[state.hand];
  Object.assign($('whole'), k === 'dT' ? { min: -lim, max: lim, step: 1 } : k === 'dBcd' ? { min: -BCD_RANGE, max: BCD_RANGE, step: BCD_STEP } : { min: RANGE[k][0], max: RANGE[k][1], step: STEP });
  $('whole').value = state[k];
  $('alpha').value = state.alpha;
  $('width').value = mm() ? Number((state.width * 25.4).toFixed(1)) : Number(state.width.toFixed(3));
};
// rounded to the finest step on the page, so a dragged value never carries float dust
$('whole').addEventListener('input', (e) => { state[WHOLE[state.hand]] = Number(Number(e.target.value).toFixed(5)); update(); });
$('alpha').addEventListener('input', (e) => { state.alpha = Number(e.target.value); update(); });
// The plate width is typed, in the length unit showing. A figure out of range leaves the last good one standing.
$('width').addEventListener('input', (e) => { const w = Number(e.target.value) / (mm() ? 25.4 : 1); if (w >= WIDTH_RANGE[0] && w <= WIDTH_RANGE[1]) { state.width = w; update(); } });
// The tooth count is typed. A figure that is not a whole number in range leaves the last good one standing.
$('teeth').value = state.teeth;
$('teeth').addEventListener('input', (e) => { const n = Number(e.target.value); if (Number.isInteger(n) && n >= 20 && n <= 250) { state.teeth = n; update(); } });
// What each slider goes back to: the standard.
const STANDARD = { dBcd: 0, dT: 0, plate: STACK.plate, tape: STACK.tape };
// A factor's row is picked with Enter or the space bar as well as a click.
$('rows').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.frow2')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('click', (e) => {
  // a reading across the face: step it, or put it back
  const fr = e.target.closest('[data-face-reset]');
  if (fr) { state.face[state.hand][Number(fr.dataset.faceReset)] = 0; update(); return; }
  const fn = e.target.closest('[data-face]');
  if (fn) { const i = Number(fn.dataset.face); setFace(i, state.face[state.hand][i] + Number(fn.dataset.by) * CATS[state.hand].step); return; }
  // a row's own reset: that factor back to standard altogether, as a whole and across the face.
  // It does not take the factor in hand.
  const rr = e.target.closest('[data-row-reset]');
  if (rr) {
    const f = rr.dataset.rowReset;
    state[WHOLE[f]] = STANDARD[WHOLE[f]];
    if (state.face[f]) state.face[f] = [0, 0, 0, 0];
    setSliders(); update(); return;
  }
  // the factor in hand as a whole: step it
  const k = WHOLE[state.hand];
  const n = e.target.closest('[data-whole]');
  if (n) {
    const by = Number(n.dataset.whole) * (k === 'dT' ? 1 : k === 'dBcd' ? BCD_STEP : STEP), el = $('whole');
    state[k] = Math.max(Number(el.min), Math.min(Number(el.max), Number((state[k] + by).toFixed(5))));
    setSliders(); update(); return;
  }
  const b = e.target.closest('[data-group]');
  if (!b) return;
  const { group, value } = b.dataset;
  if (group === 'temp' && value !== state.temp) state.dT = Math.round(value === 'C' ? state.dT / 1.8 : state.dT * 1.8);
  state[group] = group === 'plate' || group === 'tape' ? Number(value) : value;
  setSliders(); update();
});

const hash = window.location.hash.slice(1).split(',');
if (hash.includes('light')) state.theme = 'light';
if (hash.includes('mm')) state.len = 'mm';
if (hash.includes('celsius')) { state.temp = 'C'; state.dT = 8; }
if (hash.includes('alu')) state.metal = 'aluminium';
// #example dials in the small example the demo page's screenshot was taken with.
if (hash.includes('example')) Object.assign(state, { dBcd: 0.0002, dT: 15, plate: 0.0675, tape: 0.016 });
const hp = PATTERNS.find(p => hash.includes(p[0]));
if (hp) state.pat = hp[0];
if (hash.includes('thin')) state.plate = 0.045;
if (hash.includes('each')) state.show = 'each';
// #face opens across the face. #f4=0.0005 sets a BCD reading, #t4= a tape one and #p4= a plate one,
// #w=13 the plate width, all in inches; #hand=tape puts that factor in hand.
if (hash.includes('face')) state.show = 'face';
if (hash.includes('follows')) state.flex = 'follows';
for (const h of hash) {
  const m = /^([ftp])([1-4])=(-?[\d.]+)$/.exec(h), c = m && { f: 'bcd', t: 'tape', p: 'plate' }[m[1]];
  if (m) state.face[c][m[2] - 1] = Math.max(-CATS[c].lim, Math.min(CATS[c].lim, Number(m[3])));
  const w = /^w=([\d.]+)$/.exec(h), k = /^hand=(bcd|temp|tape|plate)$/.exec(h);
  if (w) state.width = Math.max(WIDTH_RANGE[0], Math.min(WIDTH_RANGE[1], Number(w[1])));
  if (k) state.hand = k[1];
}
setSliders(); update();
</script>
</body>
</html>
