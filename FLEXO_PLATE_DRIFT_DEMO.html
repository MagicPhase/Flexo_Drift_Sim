<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLEXO Plate travel: demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* A presentation layer over two screenshots of FLEXO_PLATE_DRIFT.html (light,
     1440 x 980): one with the four changes all together, one across the face.
     Each stop dims the page, leaves one part lit, and explains it in a few
     bubbles. Everything is placed in the screenshots' own pixels and the whole
     stage is scaled to fit the window. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b1220; color: #e5e7eb; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #fit { position: absolute; left: 0; right: 0; top: 0; bottom: 52px; }
  #stage { position: absolute; left: 0; top: 0; width: 1440px; height: 980px; transform-origin: 0 0; background: #ffffff; overflow: hidden; }
  #stage img, #stage svg { position: absolute; left: 0; top: 0; width: 1440px; height: 980px; display: block; }
  #stage img[hidden] { display: none; }

  .note { position: absolute; padding: 10px 14px 12px 16px; border-radius: 10px; background: #ffffff; color: #1f2937; border: 1px solid #cbd5e1; border-left: 6px solid var(--c, #2563eb); box-shadow: 0 10px 28px rgba(2, 6, 23, .45); }
  .note h3 { margin: 0 0 3px; font-size: 16px; font-weight: 800; color: #0f172a; }
  .note p { margin: 0; font-size: 14.5px; line-height: 1.42; }
  .note b { font-weight: 700; color: #0f172a; }
  .note.title { padding: 26px 32px 28px; border-left-width: 1px; text-align: center; }
  .note.title h3 { font-size: 34px; letter-spacing: 1px; margin-bottom: 8px; }
  .note.title h3 span { font-weight: 400; letter-spacing: 0; color: #64748b; margin-left: 10px; }
  .note.title p { font-size: 17px; }
  .note.title ol { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .note.title li { padding: 4px 12px; border-radius: 999px; background: #eff6ff; border: 1px solid #bfdbfe; font-size: 14px; font-weight: 700; color: #1e3a8a; }

  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #111827; border-top: 1px solid #1f2937; }
  #bar button { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #f9fafb; font: inherit; font-weight: 700; cursor: pointer; }
  #bar button:disabled { opacity: .35; cursor: default; }
  #bar button:focus-visible, .dot:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
  #where { width: 62px; font-weight: 800; color: #9ca3af; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #name { font-size: 17px; font-weight: 800; color: #f9fafb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1px solid #374151; background: transparent; color: #9ca3af; font: inherit; font-weight: 800; cursor: pointer; }
  .dot.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  .sp { flex: 1; }
  .hint { color: #6b7280; font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <img id="shot-all" src="FLEXO_PLATE_DRIFT_DEMO_files/screen-light.png" alt="FLEXO Plate travel, in light mode, with a 71 tooth example set and the four changes all together">
    <img id="shot-face" src="FLEXO_PLATE_DRIFT_DEMO_files/screen-face.png" alt="The same example across the face, with the tape 0.001 inch thicker at reading 4" hidden>
    <svg id="veil" viewBox="0 0 1440 980" aria-hidden="true"></svg>
    <div id="notes"></div>
  </div>
</div>
<div id="bar">
  <span id="where"></span>
  <span id="name"></span>
  <span class="sp"></span>
  <span class="hint">← → to move</span>
  <span id="dots"></span>
  <button type="button" id="back">Back</button>
  <button type="button" id="next">Next</button>
</div>

<script>
// Everything is in the screenshots' pixels (1440 x 980).
//   face   true for a stop that stands on the across-the-face screenshot
//   lit    the parts left bright: [x, y, width, height]
//   notes  the bubbles: where each sits, its colour, and the points it arrows to
//          (and, rarely, the point an arrow leaves from)
const W = 1440, H = 980;
const BLUE = '#2563eb', BCD = '#00a3e0', TEMP = '#e4007c', PLATE = '#2e9e4f', TAPE = '#f07d1a', AMBER = '#b45309';
const STEPS = [
  {
    name: 'FLEXO Plate travel',
    lit: [],
    notes: [{ x: 370, y: 330, w: 700, title: true,
      h: 'FLEXO <span>Plate travel</span>',
      p: 'How far the end of the repeat moves when the cylinder, its temperature, the plate or the tape is off standard.',
      list: ['1 The standard', '2 The four factors', '3 One slider', '4 The result', '5 Across the face', '6 The sheet'] }],
  },
  {
    name: 'The standard',
    lit: [[12, 50, 1416, 94]],
    notes: [
      { x: 30, y: 216, w: 262, h: 'Tooth count', p: 'Type the gear’s tooth count in its box. Teeth × pitch is the repeat: 71 × 0.125" = <b>8.875"</b>.', to: [[94, 138]] },
      { x: 310, y: 216, w: 350, h: 'The standard', p: 'The standard plate, backing and tape give the <b>Standard BCD</b>: the bare cylinder that prints the repeat exactly. <b>Distortion</b> is how much shorter the plate is made: 4.389% off, so 95.611% of the repeat.', to: [[408, 138], [588, 138]] },
      { x: 678, y: 216, w: 420, h: 'What one step is worth', p: 'One box, four figures: one small change of each factor, in thousandths of an inch at the end of the repeat, in the factors’ colours. <b>Minus prints short.</b>', to: [[1000, 138]] },
      { x: 1116, y: 216, w: 296, h: 'Units', p: 'Inches or millimetres, °F or °C. The whole page reads in the units picked here.', to: [[1372, 138]] },
    ],
  },
  {
    name: 'The four factors',
    lit: [[12, 144, 612, 255]],
    notes: [
      { x: 720, y: 120, w: 620, c: BCD, h: 'Cylinder BCD', p: 'The bare cylinder as measured. Larger than standard lifts the plate off centre, so the repeat prints short. Here <b>+0.0002"</b> costs 0.66 thou.', to: [[616, 213]] },
      { x: 720, y: 218, w: 620, c: TEMP, h: 'Temperature', p: 'Warmer than when it was measured. Metal grows with heat, aluminium about twice as much as steel. Here <b>+15°F</b> costs 0.85 thou on steel.', to: [[616, 264]] },
      { x: 720, y: 316, w: 620, c: PLATE, h: 'Plate thickness', p: 'The plate on the cylinder. Art is made short for its plate, so a thicker plate carries shorter art. Here <b>+0.0005"</b> costs 3.29 thou.', to: [[616, 316]] },
      { x: 720, y: 414, w: 620, c: TAPE, h: 'Mounting tape', p: 'The tape under the plate. Thicker tape lifts the plate just as a larger cylinder does. Here <b>+0.001"</b> costs 6.57 thou.', to: [[616, 367]] },
      { x: 120, y: 450, w: 440, h: 'Reading a row', p: 'What it is set to, then a bar on one scale shared by all four: left of the line prints short, right prints long. Last, how far the end of the repeat lands from where it should.', to: [[248, 394], [382, 394], [518, 394]] },
    ],
  },
  {
    name: 'One slider',
    lit: [[12, 337, 612, 136]],
    notes: [
      { x: 60, y: 196, w: 400, c: TAPE, h: 'In hand', p: 'Click a row to take that factor in hand. The row lights up and the slider under the list becomes its slider. Here it is the tape.', to: [[104, 341]] },
      { x: 664, y: 300, w: 440, c: AMBER, h: 'Reset', p: 'The amber button at the end of a row puts that factor back to standard, across the face as well.', to: [[607, 367]] },
      { x: 120, y: 520, w: 460, h: 'One slider, with jumps', p: '<b>−</b> and <b>+</b> move one step. The buttons under the slider jump to common thicknesses. With temperature in hand they pick steel or aluminium.', to: [[82, 464], [303, 432]] },
    ],
  },
  {
    name: 'The result',
    lit: [[624, 144, 804, 614]],
    notes: [
      { x: 770, y: 24, w: 430, h: 'Three views', p: '<b>All together</b> is the four changes at once. <b>Each</b> shows them one at a time, in their colours. <b>Across the face</b> comes next.', to: [[980, 159]] },
      { x: 150, y: 150, w: 420, h: 'Test patterns', p: 'Six targets to read the travel on: crosshair, register mark, micro print, two rosettes and micro circles. <b>Ink</b> fades the black so the standard shows through.', to: [[640, 215]] },
      { x: 150, y: 290, w: 420, h: 'All together', p: 'The four changes at once, for the cylinder type chosen. This repeat prints <b>8.8636"</b> where 8.8750" was wanted.', from: [570, 318], to: [[640, 264]] },
      { x: 150, y: 420, w: 420, h: 'Under the glass', p: '<b>Grey</b> is where the mark should land. <b>Black</b> is where it lands with all four changes together: 11.4 thou short here.', to: [[912, 420]] },
      { x: 900, y: 790, w: 430, h: 'Scale', p: 'The two bars under the lens give its scale. On a rosette the lens splits: standard on the left, as set on the right.', to: [[1120, 706]] },
    ],
  },
  {
    name: 'Across the face',
    face: true,
    lit: [[12, 462, 612, 512]],
    notes: [
      { x: 60, y: 318, w: 440, h: 'Face against the pitch line', p: 'How far the plate’s face stands off the gear’s pitch line at each of four readings across the cylinder.', to: [[118, 478]] },
      { x: 664, y: 440, w: 470, c: PLATE, h: 'A cut through the cylinder', p: 'Cylinder, tape and plate, each with a strip in its own colour. Click a strip to take that layer in hand.', to: [[542, 630]] },
      { x: 664, y: 548, w: 470, c: TAPE, h: 'Four readings', p: 'Drag a point to make the layer thicker or thinner there. The dashed rails are as far as a point goes. Here the tape is <b>0.001" thicker at reading 4</b>.', to: [[548, 710]] },
      { x: 664, y: 690, w: 470, c: AMBER, h: 'Under each reading', p: '<b>−</b> and <b>+</b> move that reading one step. The amber button puts that one reading back.', to: [[611, 904]] },
      { x: 720, y: 850, w: 620, h: 'Stiff or follows', p: 'A <b>stiff</b> plate will not stretch: it sits on the straight taper through the four readings and walks sideways. A plate that <b>follows</b> prints each reading at its own length. A real plate lies between the two.', to: [[188, 948]] },
    ],
  },
  {
    name: 'The sheet',
    face: true,
    lit: [[624, 144, 804, 729]],
    notes: [
      { x: 760, y: 24, w: 430, h: 'Plate width', p: 'How wide the plate is across the cylinder. The four readings are spread evenly from one edge of it to the other.', to: [[1213, 213]] },
      { x: 140, y: 196, w: 440, h: 'Four figures', p: 'How far out of square the tail edge is, how much the diagonals differ, how much the tail edge bows, and how far the tail has walked sideways: here <b>1.84 thou toward side 4</b>.', to: [[633, 275]] },
      { x: 140, y: 372, w: 440, h: 'Corner lenses', p: 'A lens at each corner of the plate. It is laid down at the lead edge, so the lead corners show no travel. The tail corners show it both ways: along the web and sideways.', to: [[658, 442]] },
      { x: 140, y: 528, w: 440, h: 'The sheet', p: 'The plate laid flat, lead edge on the left, standard in grey and as set in black. The figures at the tail are thou short at each reading. The travel is drawn <b>×100</b> so it can be seen.', to: [[848, 558]] },
    ],
  },
];

const $ = (id) => document.getElementById(id);
let step = 0;

// The nearest point on a bubble's edge to where its arrow is going, kept off the corners.
const edgePoint = (r, [tx, ty]) => {
  const inX = tx >= r.x && tx <= r.x + r.w, inY = ty >= r.y && ty <= r.y + r.h, pad = 18;
  const cx = Math.max(r.x + pad, Math.min(r.x + r.w - pad, tx)), cy = Math.max(r.y + pad, Math.min(r.y + r.h - pad, ty));
  if (inX) return [cx, ty < r.y ? r.y : r.y + r.h];
  if (inY) return [tx < r.x ? r.x : r.x + r.w, cy];
  // off a corner: leave from whichever side faces the target more squarely
  const dx = tx < r.x ? r.x - tx : tx - (r.x + r.w), dy = ty < r.y ? r.y - ty : ty - (r.y + r.h);
  return dx > dy ? [tx < r.x ? r.x : r.x + r.w, cy] : [cx, ty < r.y ? r.y : r.y + r.h];
};

const show = () => {
  const s = STEPS[step];
  $('shot-all').hidden = Boolean(s.face);
  $('shot-face').hidden = !s.face;
  $('notes').innerHTML = s.notes.map((n, i) => `<div class="note${n.title ? ' title' : ''}" data-i="${i}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;--c:${n.c || BLUE}"><h3>${n.h}</h3><p>${n.p}</p>${n.list ? `<ol>${n.list.map(t => `<li>${t}</li>`).join('')}</ol>` : ''}</div>`).join('');
  // The arrows start from the bubbles as laid out, so they are drawn after the text.
  let arrows = '';
  for (const el of $('notes').children) {
    const n = s.notes[Number(el.dataset.i)], r = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }, c = n.c || BLUE;
    for (const to of n.to || []) {
      // `from` starts an arrow at a chosen point, to steer it clear of something lit
      const [x1, y1] = n.from || edgePoint(r, to), [x2, y2] = to, a = Math.atan2(y2 - y1, x2 - x1);
      const head = (len, spread) => [[x2, y2], [x2 - len * Math.cos(a - spread), y2 - len * Math.sin(a - spread)], [x2 - len * Math.cos(a + spread), y2 - len * Math.sin(a + spread)]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
      const bx = x2 - 9 * Math.cos(a), by = y2 - 9 * Math.sin(a);
      arrows += `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/><polygon points="${head(17, 0.5)}" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>`
        + `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/><polygon points="${head(15, 0.42)}" fill="${c}"/>`;
    }
  }
  const holes = s.lit.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"`);
  $('veil').innerHTML = `<defs><mask id="lit"><rect width="${W}" height="${H}" fill="#fff"/>${holes.map(h => `${h} fill="#000"/>`).join('')}</mask></defs>
    <rect width="${W}" height="${H}" fill="#0f172a" fill-opacity="${s.lit.length ? 0.5 : 0.62}" mask="url(#lit)"/>
    ${holes.map(h => `${h} fill="none" stroke="${BLUE}" stroke-width="3"/>`).join('')}${arrows}`;

  $('where').textContent = step === 0 ? 'Start' : `${step} of ${STEPS.length - 1}`;
  $('name').textContent = s.name;
  $('dots').innerHTML = STEPS.map((x, i) => `<button type="button" class="dot${i === step ? ' on' : ''}" data-go="${i}" title="${x.name}" aria-label="${x.name}" aria-current="${i === step}">${i === 0 ? '•' : i}</button>`).join('');
  $('back').disabled = step === 0;
  $('next').disabled = step === STEPS.length - 1;
  try { history.replaceState(null, '', `#${step}`); } catch { /* a file page that will not take it still works */ }
};
const go = (n) => { step = Math.max(0, Math.min(STEPS.length - 1, n)); show(); };
const fit = () => {
  const box = $('fit'), k = Math.min(box.clientWidth / W, box.clientHeight / H);
  $('stage').style.transform = `translate(${(box.clientWidth - W * k) / 2}px, ${(box.clientHeight - H * k) / 2}px) scale(${k})`;
};

$('back').addEventListener('click', () => go(step - 1));
$('next').addEventListener('click', () => go(step + 1));
$('dots').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(step + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(step - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(STEPS.length - 1);
});
window.addEventListener('resize', fit);
const first = Number(window.location.hash.slice(1));
if (Number.isInteger(first)) step = Math.max(0, Math.min(STEPS.length - 1, first));
fit(); show();
</script>
</body>
</html>
